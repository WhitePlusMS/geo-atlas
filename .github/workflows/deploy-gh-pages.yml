name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, mater]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: DTC_2026_Web/package-lock.json

      - name: Install dependencies
        working-directory: DTC_2026_Web
        run: npm ci

      # prebuild 同步相邻目录的数据并检查数据合同，然后进行 TypeScript 编译和 Vite 构建。
      - name: Build frontend
        working-directory: DTC_2026_Web
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./DTC_2026_Web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
